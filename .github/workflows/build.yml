name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.20.2", "22", "24"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check generated files
        run: |
          test -s public/index.html
          test -s public/css/styles.min.css
          test -s public/js/scripts.min.js
          test -s public/js/jquery.min.js
          cmp src/third-party/font-awesome/fonts/fontawesome-webfont.woff2 public/fonts/fontawesome-webfont.woff2
      - name: Check archive
        run: |
          npx --no-install gulp archive
          for archive in build/*.zip; do
            unzip -t "$archive"
          done
